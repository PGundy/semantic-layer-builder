name: revenue_by_customer_region
question: What is revenue by the customer's home region?
request:
  source: warehouse
  measures: [orders.revenue]
  dimensions: [customers.region]
sql: |
  select c.region,
         sum(o.amount_cents / 100.0) filter (where o.status <> 'cancelled' and coalesce(c.is_test_account, false) = false) as revenue
  from public.fct_orders o
  left join public.dim_customers c on c.customer_id = o.customer_id
  group by 1 order by 1
status: draft
