name: aov_by_region
question: What is the average order value in my region?
role: sales_rep
user: { region: west }
request:
  source: warehouse
  measures: [average_order_value, orders.order_count]
  dimensions: [orders.ship_region]
  filters:
    - { field: orders.status, op: in, value: [completed, shipped] }
sql: |
  select o.ship_region,
         sum(o.amount_cents / 100.0) filter (where o.status <> 'cancelled' and coalesce(c.is_test_account, false) = false)
           / count(*) as average_order_value,
         count(*) as order_count
  from public.fct_orders o
  left join public.dim_customers c on c.customer_id = o.customer_id
  where o.ship_region = 'west' and o.status in ('completed', 'shipped')
  group by 1
status: draft
