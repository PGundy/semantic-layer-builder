model: orders
source: warehouse
table: public.fct_orders
status: approved
approved_by: Dana Ruiz
approved_at: 2026-01-15
approved_hash: sha256:62d32576d9b3b224011839c18b7081b9518fbaa7cf501e499466c5edd3068d01
description: Customer orders, one row per order.
grain: One row per order.
primary_key: [order_id]
tags: []
dimensions:
  - name: order_date
    expr: created_at
    type: time
    time_grains: [day, week, month, quarter, year]
    description: When the order was placed, UTC.
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-01-15
    approved_hash: sha256:da4f577fbe093eab49afce0e35ef7cf10ab02649c2cb5d2e0b3c1fac82a161cb
  - name: status
    expr: status
    type: string
    description: Order lifecycle state.
    status: draft
  - name: ship_region
    expr: ship_region
    type: string
    description: Region the order ships to.
    status: draft
  - name: customer_region
    expr: customer.region
    type: string
    description: Home region of the customer who placed the order; blank when the customer is missing.
    status: draft
measures:
  - name: revenue
    expr: amount_cents / 100.0
    agg: sum
    filter: status <> 'cancelled' and coalesce(customer.is_test_account, false) = false
    format: currency
    currency: USD
    description: Order value excluding cancelled orders and orders from test accounts; orders whose customer is missing count.
    synonyms: [sales]
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-01-15
    approved_hash: sha256:5fc701e30d133aa9d96fb5c0d6fbae04a135bd39df55ec1d5526692529938439
  - name: order_count
    agg: count
    format: integer
    description: Number of orders.
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-01-15
    approved_hash: sha256:74add0e89306d471b29ba5374a55825d7b444b73b81a1618cc89a822d9207a18
joins:
  - name: customer
    to: customers
    keys:
      - { from: customer_id, to: customer_id }
    relationship: many_to_one
    type: left
    origin: declared
    description: The customer who placed the order.
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-01-15
    approved_hash: sha256:7d56e76693d381406b860830a70ea99f4a42cbe62c5b76034a30bc5f308c76ae
    evidence:
      checked_at: 2026-01-15T12:10:00.000Z
      to: customers
      keys:
        - { from: customer_id, to: customer_id }
      left_rows: 10000
      left_null_keys: 0
      matched_rows: 10000
      match_rate: 1
      right_rows: 2000
      right_key_unique: true
      left_key_unique: false
      max_fanout: 1
      suggested_relationship: many_to_one
