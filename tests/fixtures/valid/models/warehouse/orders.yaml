model: orders
source: warehouse
table: public.fct_orders
status: approved
approved_by: Dana Ruiz
approved_at: 2026-01-15
approved_hash: sha256:65b61915efa994a2f4e8fdb8e9d5e220a8a99cf570c76e65461fa802e7adfd77
description: Customer orders, one row per order.
grain: One row per order.
primary_key: [order_id]
tags: []
dimensions:
  - name: order_date
    expr: created_at
    type: time
    time_grains: [day, week, month, quarter, year]
    description: When the order was placed, UTC.
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-01-15
    approved_hash: sha256:32200472001eed7ea9713bbaa9fbe67c67cbb8f7cbb9ec4a7ac70b861e0876ea
  - name: status
    expr: status
    type: string
    description: Order lifecycle state.
    status: draft
  - name: ship_region
    expr: ship_region
    type: string
    description: Region the order ships to.
    status: draft
  - name: customer_region
    expr: customer.region
    type: string
    description: Home region of the customer who placed the order; blank when the customer is missing.
    status: draft
measures:
  - name: revenue
    expr: amount_cents / 100.0
    agg: sum
    filter: status <> 'cancelled' and coalesce(customer.is_test_account, false) = false
    format: currency
    currency: USD
    description: Order value excluding cancelled orders and orders from test accounts; orders whose customer is missing count.
    synonyms: [sales]
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-01-15
    approved_hash: sha256:987595bbef1661660400a30945dccd2ce7fffc584bbf374933e52786ccf36a85
  - name: order_count
    agg: count
    format: integer
    description: Number of orders.
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-01-15
    approved_hash: sha256:6690403fcc95db7f1de19f92ebff72b039b45d88f53cffbb843e318c5d7c0f8b
joins:
  - name: customer
    to: customers
    keys:
      - { from: customer_id, to: customer_id }
    relationship: many_to_one
    type: left
    origin: declared
    description: The customer who placed the order.
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-01-15
    approved_hash: sha256:96cd14263bf8ed85b004b16ef7cbfa5197da6ca327cc5e6581fc19152081c06f
    evidence:
      checked_at: 2026-01-15T12:10:00.000Z
      to: customers
      keys:
        - { from: customer_id, to: customer_id }
      left_rows: 10000
      left_null_keys: 0
      matched_rows: 10000
      match_rate: 1
      right_rows: 2000
      right_key_unique: true
      left_key_unique: false
      max_fanout: 1
      suggested_relationship: many_to_one
