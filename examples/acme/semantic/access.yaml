# Drafted from Dana Ruiz's simplification (session 3): open access, everyone at Acme sees every approved figure, with
# three exceptions: personal data for analytics only, refunds and net revenue for finance and analytics only, and sales
# limited to their own and their team's orders through sales_team_closure. Marketing has no role; a user with no
# department gets the everyone view. Replaces the closed file with analyst, sales_rep (by region) and marketing roles.
status: approved
approved_by: Dana Ruiz
approved_at: 2026-10-27
mode: open
user_attributes:
  - name: department
    type: string
    description: The user's department in the login system, for example analytics, finance, sales or marketing.
  - name: employee_id
    type: number
    description: The user's own employee id. For people in sales it equals their rep_id in sales_reps and orders.sales_rep_id.
roles:
  - name: analyst
    description: >-
      Analysts: everyone whose department is analytics. They see what everyone sees, plus personal data (customer email,
      phone, first and last name, and sales people's full names and emails), and refunds and net revenue. Every row.
    assign_when: user.department == 'analytics'
    allow:
      tags: [pii]
  - name: finance
    description: >-
      Finance: everyone whose department is finance. They see what everyone sees, plus refunds and net revenue. Every
      row. No personal data.
    assign_when: user.department == 'finance'
  - name: sales
    description: >-
      Sales: everyone whose department is sales. They see what everyone sees, but only the orders credited to them or to
      someone below them in the sales hierarchy (sales_team_closure): a rep sees their own orders, a manager their
      team's, and 301 every order. Their employee_id is their rep_id. They see the order lines (order_items) of the
      orders they can see, and no others: a rep the lines on their own orders, a manager the lines on their team's
      orders. Someone in sales with no employee_id sees no orders and no order lines until IT sets it, and still
      sees everything else everyone sees. No personal data, refunds or net revenue.
    assign_when: user.department == 'sales'
    # Coverage gap: the sales goldens read orders directly, and none crosses order_items' order join as sales.
    # order_items has no measure to count lines with, and Dana Ruiz chose not to add one only for a test (session 4);
    # a golden is added when a product or line figure is defined.
    row_filters:
      - model: warehouse.orders
        hierarchy:
          column: sales_rep_id
          via: warehouse.sales_team_closure
          manager: manager_id
          member: member_id
          user: user.employee_id
          include_self: true
      # Lines follow their order (Dana Ruiz, session 4): the same hierarchy, read through the line's order join.
      - model: warehouse.order_items
        hierarchy:
          column: order.sales_rep_id
          via: warehouse.sales_team_closure
          manager: manager_id
          member: member_id
          user: user.employee_id
          include_self: true
restrictions:
  - name: refunds_and_net_revenue
    description: Refunds (the whole refunds table) and net revenue are for finance and analytics only.
    targets: ["warehouse.refunds", "metric:net_revenue"]
    allow:
      roles: [analyst, finance]
