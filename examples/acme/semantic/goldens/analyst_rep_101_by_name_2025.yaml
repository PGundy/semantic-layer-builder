name: analyst_rep_101_by_name_2025
question: As an analyst, what were rep 101's revenue and number of orders in 2025, with the rep's name?
role: analyst
user:
  department: analytics
request:
  source: warehouse
  measures: [orders.revenue, orders.order_count]
  dimensions: [sales_reps.full_name]
  filters:
    - { field: orders.sales_rep_id, op: eq, value: 101 }
    - { field: orders.order_date, op: gte, value: "2025-01-01" }
    - { field: orders.order_date, op: lt, value: "2026-01-01" }
sql: |
  -- The analyst role: no row filters, and personal data (the rep's full name) allowed.
  select sales_rep.full_name as full_name,
         sum(o.amount_cents / 100.0)
           filter (where o.status in ('completed', 'shipped')
                     and coalesce(test_account.is_test_account, false) = false
                     and coalesce(test_account.email, '') not like '%@example-test.com') as revenue,
         count(*)
           filter (where o.status in ('completed', 'shipped')
                     and coalesce(test_account.is_test_account, false) = false
                     and coalesce(test_account.email, '') not like '%@example-test.com') as order_count
  from acme.fct_orders o
  left join acme.dim_customers test_account on test_account.customer_id = o.customer_id
  left join acme.dim_sales_reps sales_rep on sales_rep.rep_id = o.sales_rep_id
  where o.sales_rep_id = 101
    and o.created_at >= '2025-01-01' and o.created_at < '2026-01-01'
  group by 1
reference: "Dana Ruiz's 2025 figure for rep 101, credited by orders.sales_rep_id, revenue rules, UTC days: $34,938.49 from 251 orders."
status: approved
expected:
  tolerance: 0
  rows:
    - full_name: Avery Patel
      revenue: 34938.49
      order_count: 251
confirmed_by: Dana Ruiz
confirmed_at: 2026-10-27
