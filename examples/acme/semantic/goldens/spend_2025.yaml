name: spend_2025
question: What was total marketing spend in 2025?
request:
  source: lake
  measures: [marketing_spend.spend]
  filters:
    - { field: marketing_spend.spend_date, op: gte, value: "2025-01-01" }
    - { field: marketing_spend.spend_date, op: lt, value: "2026-01-01" }
sql: |
  select round(sum(spend_cents / 100.0), 2) as spend
  from marketing_spend
  where spend_date >= '2025-01-01' and spend_date < '2026-01-01'
reference: Dana Ruiz's 2025 marketing spend figure - $16,502.34.
status: approved
expected:
  tolerance: 0
  rows:
    - spend: 16502.34
confirmed_by: Dana Ruiz
confirmed_at: 2026-10-26
