name: sales_manager_203_2025
question: As a sales manager (employee id 203), what were my revenue and number of orders in 2025?
role: sales
user:
  department: sales
  employee_id: 203
request:
  source: warehouse
  measures: [orders.revenue, orders.order_count]
  filters:
    - { field: orders.order_date, op: gte, value: "2025-01-01" }
    - { field: orders.order_date, op: lt, value: "2026-01-01" }
sql: |
  -- The sales role: the hierarchy row filter on orders in where, own orders included (include_self), the closure read
  -- without row filters, and the test-account rule through test_accounts, which no row filter touches.
  select sum(o.amount_cents / 100.0)
           filter (where o.status in ('completed', 'shipped')
                     and coalesce(test_account.is_test_account, false) = false
                     and coalesce(test_account.email, '') not like '%@example-test.com') as revenue,
         count(*)
           filter (where o.status in ('completed', 'shipped')
                     and coalesce(test_account.is_test_account, false) = false
                     and coalesce(test_account.email, '') not like '%@example-test.com') as order_count
  from acme.fct_orders o
  left join acme.dim_customers test_account on test_account.customer_id = o.customer_id
  where (o.sales_rep_id = 203
         or o.sales_rep_id in (select member_id from acme.sales_team_closure where manager_id = 203))
    and o.created_at >= '2025-01-01' and o.created_at < '2026-01-01'
reference: "Dana Ruiz's 2025 team figure for manager 203 (UTC days): $55,448.30 from 409 orders."
status: approved
expected:
  tolerance: 0
  rows:
    - revenue: 55448.3
      order_count: 409
confirmed_by: Dana Ruiz
confirmed_at: 2026-10-27
