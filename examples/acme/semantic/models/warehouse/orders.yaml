model: orders
source: warehouse
table: acme.fct_orders
status: approved
approved_by: Dana Ruiz
approved_at: 2026-10-26
approved_hash: sha256:64784e89bffb9973e2cafd70b0027e8b65c1d55fa3ac1fd6d20608769b4b620d
description: >-
  Orders from the storefront, one row per order. Amounts in integer cents; every order is priced and charged in USD.
  A sale is an order with status completed or shipped; cancelled orders were never charged and refunded orders were
  refunded in full, so neither counts. Orders from test accounts (customers flagged is_test_account, or whose email ends
  in @example-test.com) are left out of every order figure. Orders whose customer record was deleted at the customer's
  request (customer_id 501 to 560, no row in customers) are real and count. Days and months are UTC.
grain: One row per order.
primary_key:
  - order_id
ignored_columns:
  - shipping_cents
  - currency
  - gift_message
dimensions:
  - name: order_date
    expr: created_at
    type: time
    description: When the customer placed the order (created_at), with days, weeks, months and years in UTC, as Finance reports. This is the date for "orders in March" and "2025 revenue".
    synonyms: [order day, purchase date]
    time_grains:
      - hour
      - day
      - week
      - month
      - quarter
      - year
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:90b9cacbacbd4784164bb840cbd37aa3be6f9ceda099eca82007a4245db52304
  - name: status
    expr: status
    type: string
    description: >-
      The order's status: completed (3,950 orders), cancelled (484), shipped (398) or refunded (168). Only completed and
      shipped orders count as sales, so revenue, order count and AOV broken down by status show only those two.
    synonyms: [order status]
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:ba0d81e365565a776b751051db02d3d8262126d6009ce70e6608e05275853290
  - name: ship_region
    expr: ship_region
    type: string
    description: >-
      Code of the region the order shipped to: NE, WC, SE, MW, SW or INT. This is Acme's sales region: "revenue by
      region", regional reports and sales territories use it, not the customer's home region (customers.home_region), which
      differs on 248 of the 4,941 orders whose customer still exists; the 59 orders of deleted customers have no home region.
    synonyms: [region, sales region, sales territory]
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:b53043ca96e95fd2188d10ef9f53042fa998282c5cb04cf7e1f9df9b9337fca8
  - name: ship_region_name
    expr: ship_to_region.region_name
    type: string
    description: >-
      Name of the region the order shipped to (Northeast, West Coast, Southeast, Midwest, Southwest, International), from
      regions. Same region as ship_region; use it for "revenue by region".
    synonyms: [region name, sales region name]
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:43144b7ec4dbe1d61e6d9f72f02eca671ad31e0ded763b5d5ca45a8596a6b13d
  - name: sales_rep_id
    expr: sales_rep_id
    type: number
    description: >-
      The id of the sales rep credited with the order (rep_id in sales_reps). Every order names one rep, and the rep
      always covers the region the order shipped to. Revenue and order count by rep follow the revenue rules. Rep names
      come from sales_reps through the sales_rep join and are personal data.
    synonyms: [sales rep, rep]
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-27
    approved_hash: sha256:3879407904860bca131855e9efd9ca9f7f81826fabb194de00594bfa96f27ad0
measures:
  - name: order_count
    agg: count
    filter: status in ('completed', 'shipped') and coalesce(test_account.is_test_account, false) = false and coalesce(test_account.email, '') not like '%@example-test.com'
    format: integer
    description: >-
      Number of orders that count as sales: status completed or shipped, leaving out cancelled and refunded orders and
      orders from test accounts (flagged is_test_account on the customer, or customer email ending in @example-test.com,
      read through the test_account join so the rule holds for every role). Orders whose customer record was deleted
      count. Same rules as revenue.
    synonyms: [orders, number of orders]
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:29c1e8d0035f5945df5a6fece2c5fd5b457ae1cce949276a104b5f720a904f7c
  - name: revenue
    expr: amount_cents / 100.0
    agg: sum
    filter: status in ('completed', 'shipped') and coalesce(test_account.is_test_account, false) = false and coalesce(test_account.email, '') not like '%@example-test.com'
    format: currency
    currency: USD
    description: >-
      Revenue as Finance signs it off: order value in US dollars (amount_cents / 100, the sum of the order's line items)
      on orders with status completed or shipped. Cancelled and refunded orders are left out, and so are orders from test
      accounts (flagged is_test_account on the customer, or customer email ending in @example-test.com, read through the
      test_account join so the rule holds for every role). Orders whose customer record was deleted count. Shipping and tax are not included. Dated by order_date in UTC.
    synonyms: [sales]
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:f1f11e0edc5941e0b100e49cb3a3f8fd9947f70045b51eaf084b1e89edd240d9
  - name: discount
    expr: discount_cents / 100.0
    agg: sum
    filter: status in ('completed', 'shipped') and coalesce(test_account.is_test_account, false) = false and coalesce(test_account.email, '') not like '%@example-test.com'
    format: currency
    currency: USD
    description: >-
      Discounts given on orders, in US dollars (discount_cents / 100), counted by the same rules as revenue: completed or
      shipped orders only, test accounts left out, orders of deleted customers kept, dated by order_date in UTC. The
      order amount (amount_cents) is already after the discount, so revenue never subtracts it again. 2025 is $2,340.00
      over 311 counted orders (Dana Ruiz confirmed); discounts are $2.50, $5.00, $7.50, $10.00 or $12.50 an order.
    synonyms: [discounts]
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-27
    approved_hash: sha256:ea8c2206fc531d6b03eccf758fb01a86f1505036d9c9bbcf4387e1699332cee2
joins:
  - name: customer
    to: customers
    keys:
      - from: customer_id
        to: customer_id
    relationship: many_to_one
    type: left
    origin: inferred
    description: >-
      The customer who placed the order. 59 orders (customer_id 501 to 560) have no customer row because those customers
      asked for their accounts to be deleted; the orders are real, so the join is left and keeps them with blank customer
      details. There is no foreign key on customer_id for the same reason.
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:74f977016f974685e0e9f4f898816e02226d96c0dad9980aef6053e813a1a180
    evidence:
      checked_at: 2026-10-26T08:56:43.946Z
      left_rows: 5000
      left_null_keys: 0
      matched_rows: 4941
      match_rate: 0.9882
      right_rows: 500
      right_key_unique: true
      left_key_unique: false
      max_fanout: 1
      suggested_relationship: many_to_one
  - name: ship_to_region
    to: regions
    keys:
      - from: ship_region
        to: region_code
    relationship: many_to_one
    type: left
    origin: inferred
    description: The region the order shipped to, through ship_region = region_code.
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:35b2b5250ca83d5f26d3e118afdb8e3abb6e3c89e1a93a38d800d11601e474d9
    evidence:
      checked_at: 2026-10-26T09:17:52.838Z
      left_rows: 5000
      left_null_keys: 0
      matched_rows: 5000
      match_rate: 1
      right_rows: 6
      right_key_unique: true
      left_key_unique: false
      max_fanout: 1
      suggested_relationship: many_to_one
  - name: test_account
    to: test_accounts
    keys:
      - from: customer_id
        to: customer_id
    relationship: many_to_one
    type: left
    origin: owner
    description: >-
      The test-account rule for the order's customer, through customer_id. Revenue and order count read it here rather
      than through the customer join, so a role that sees only some customers (sales reps) or none (marketing) still has
      every test account left out. Left join: the 59 orders of deleted customers have no row and still count.
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:3d60d5ca5948036c79a2d64ddcec9acbf64441273068ef8aa058de831b07eb2f
    evidence:
      checked_at: 2026-10-26T10:43:47.169Z
      to: test_accounts
      keys:
        - from: customer_id
          to: customer_id
      left_rows: 5000
      left_null_keys: 0
      matched_rows: 4941
      match_rate: 0.9882
      right_rows: 500
      right_key_unique: true
      left_key_unique: false
      max_fanout: 1
      suggested_relationship: many_to_one
  - name: sales_rep
    to: sales_reps
    keys:
      - from: sales_rep_id
        to: rep_id
    relationship: many_to_one
    type: left
    origin: declared
    description: >-
      The sales rep credited with the order, through sales_rep_id = rep_id in sales_reps. All 5,000 orders find their
      rep, and each person appears once in sales_reps, so the join never repeats an order.
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-27
    approved_hash: sha256:9be4ac86a6fb7dbcb316c417014531699fd707ad7ad16901cbe091a4bc2e0a48
