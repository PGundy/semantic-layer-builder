model: refunds
source: warehouse
table: acme.fct_refunds
status: approved
approved_by: Dana Ruiz
approved_at: 2026-10-26
approved_hash: sha256:b2c93b6c49e0ae546534c3a21b09943ce7de9ac13d60a9f502a0bd1a091be3ce
description: >-
  Refunds issued against orders, one row per refund, amounts in integer cents (USD, as every order). Most refunds are
  partial, an order can have several refunds, and a full refund is sometimes split over two rows (344 refunds on 291
  orders, as measured; not checked against an independent report). Finance attributes a refund to the date of its order, not the
  date it was issued, so order_date (the order's created_at, UTC) is the date for refund figures and net revenue.
  Net revenue subtracts only refunds on orders that count in revenue (status completed or shipped, not a test account).
grain: One row per refund.
primary_key:
  - refund_id
dimensions:
  - name: order_date
    expr: order.created_at
    type: time
    description: >-
      When the refunded order was placed (the order's created_at), with days, weeks, months and years in UTC. Finance
      attributes a refund to this date, and net revenue dates refunds by it.
    time_grains:
      - day
      - week
      - month
      - quarter
      - year
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:0b3cec1013bc474c55c4af264c9c84a96faf2ed65b0f964c0b04156dbc851c31
  - name: refunded_at
    expr: refunded_at
    type: time
    description: >-
      When the refund was issued, in UTC. Not the date Finance uses for refunds or net revenue; use order_date for
      those.
    synonyms: [refund issued date]
    time_grains:
      - hour
      - day
      - week
      - month
      - quarter
      - year
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:1b6828f3a686d16e76e9bf845fbf060b8d6a7e503a43a05dd4c767f80d1a1b35
  - name: reason
    expr: reason
    type: string
    description: >-
      Why the refund was issued: price_adjustment (82 refunds), wrong_item (76), damaged (68), customer_request (62) or
      late_delivery (56); never empty. The counts are measured over all 344 refunds and not checked against a report.
    synonyms: [refund reason]
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:57a0c25aba9b131afbfff4f7d81fa22c68ba83e8bcdded3422310f251b84f80c
measures:
  - name: refund_amount
    expr: refunded_cents / 100.0
    agg: sum
    filter: order.status in ('completed', 'shipped') and coalesce(order.test_account.is_test_account, false) = false and coalesce(order.test_account.email, '') not like '%@example-test.com'
    format: currency
    currency: USD
    description: >-
      Refunds as Finance subtracts them from revenue: refunded_cents / 100 in US dollars, only on refunds whose order
      counts in revenue (order status completed or shipped, and not a test account: QA flag is_test_account or email
      ending in @example-test.com, read through the order's test_account join, the same rule as revenue). Refunds on
      cancelled or refunded orders are left out, because those orders are already outside revenue. Refunds on orders of
      deleted customers count. Dated by order_date (the order's created_at, UTC), not by refunded_at. An order with
      several refunds has them all added up here on their own, so net revenue never repeats an order. There is no
      figure for all refunds issued.
    synonyms: [refunds, refund total]
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:e8b6ada12803aa2c9e98c5b00e9e8cbbd92afd2f8488e468f1ca6e9093b64a28
joins:
  - name: order
    to: orders
    keys:
      - from: order_id
        to: order_id
    relationship: many_to_one
    type: left
    origin: declared
    description: >-
      The order each refund was issued against. Every refund finds its order, and each order appears once in orders, so
      the join never repeats a refund. An order with several refunds appears once per refund on this side; net revenue
      totals refunds on their own before subtracting them from revenue, so order rows are never duplicated.
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:f0f9495ab4feccc1c05c424ea70474ae13f05d737538f0478d1c0efbca03102d
    evidence:
      checked_at: 2026-10-26T10:43:46.981Z
      to: orders
      keys:
        - from: order_id
          to: order_id
      left_rows: 344
      left_null_keys: 0
      matched_rows: 344
      match_rate: 1
      right_rows: 5000
      right_key_unique: true
      left_key_unique: false
      max_fanout: 1
      suggested_relationship: many_to_one
