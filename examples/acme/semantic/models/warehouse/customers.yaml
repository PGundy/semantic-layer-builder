model: customers
source: warehouse
table: acme.dim_customers
status: approved
approved_by: Dana Ruiz
approved_at: 2026-10-26
approved_hash: sha256:cbfb590c518b285bcd654d411fadf95ff6b4b7cf04b675daae6e7b6bd4f4f8b2
description: >-
  Customer accounts, one row per customer: 500 customers, each with its own customer_id. Includes internal test
  accounts: a customer is a test account when is_test_account is true or the email ends in @example-test.com (QA does
  not always set the flag). 20 customers are test accounts: 12 flagged, 8 found only by email. The 500 and 20 counts
  are measured from the data and not checked against a report. Customers who asked for
  their accounts to be deleted have no row here, but their orders remain in orders and count in revenue. Email, phone,
  first name and last name are personal data. The test-account rule reads the email column directly, so hiding the
  email detail from a role does not change which orders are left out.
grain: One row per customer.
primary_key:
  - customer_id
open_questions:
  - >-
    New customers (Dana Ruiz needs this figure; it feeds CAC): a new customer is a customer in dim_customers, not a test
    account, whose first order that counts in revenue (status completed or shipped) falls in the period; signup date
    does not decide it, and deleted customers never count. 2025 must match 123 exactly (Dana Ruiz; a hand query gives
    123: 101 who signed up in 2025, 22 earlier). It cannot be written as a join reference. Waiting on engineering for a
    view acme.dim_customer_first_orders (one row per customer: customer_id, first_order_at = created_at of the
    customer's earliest completed or shipped order), with rows only for customers that exist in dim_customers, so the
    deleted customers' ids in fct_orders never appear. Dana Ruiz is sending this request to engineering; no date
    yet. She accepts that the view repeats the "which statuses count" rule, so it must
    change if that rule changes. If engineering cannot restrict it to dim_customers, the layer must leave deleted
    customers out itself, and the test-account rule is applied in the layer either way. Until then there is no
    new-customers measure, and no signup-date count is offered as "new customers". The draft golden new_customers_2025
    holds the 123 and names the measure customers.new_customers before it exists, so its validate warning stands until
    the view arrives (not delivered as of 2026-10-27).
  - >-
    acquisition_channel's paid values have the same names as marketing_spend.channel in the lake, but Dana Ruiz does not
    know whether they are assigned the same way, so they may not line up. The marketing team would know. Cross-source:
    not modeled, and no link is to be added (Dana Ruiz, 2026-10-27): Acme does not join the lake and the warehouse in
    queries; it lines them up in reports.
dimensions:
  - name: email
    expr: email
    type: string
    description: >-
      The customer's email address. Personal data, and the most restricted of the customer's personal details. Hiding it
      does not affect the test-account rule, which reads the column directly.
    tags:
      - pii
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:19938e900fededa45d2c3cbadd6ca781076770267087b36fc0a6d646fe925b26
  - name: phone
    expr: phone
    type: string
    description: The customer's phone number. Personal data. Often empty (12% of customers, as measured; not checked against a report).
    tags:
      - pii
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:8a2bcd44f7b4d2ea36e0e4f56dcd5dfa7711646752f728f2606806c4a64362a2
  - name: first_name
    expr: first_name
    type: string
    description: The customer's first name. Personal data.
    tags:
      - pii
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:bc7a80c3a08e7b86c9defe84c36f9b233eb302a068c6fc9f5dc71cca80c693d6
  - name: last_name
    expr: last_name
    type: string
    description: The customer's last name. Personal data.
    tags:
      - pii
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:ca01b4e6acfdeed1ef48f86b4e665058580d364c9acc8ce34ffbea9b3a6064d6
  - name: signup_date
    expr: signup_at
    type: time
    time_grains:
      - hour
      - day
      - week
      - month
      - quarter
      - year
    description: >-
      When the customer created their account (signup_at), with days, weeks, months and years in UTC. From 6 Jun 2022 to
      22 Sep 2025 (as measured; not checked against a report). This is not the date for "new customers": a new customer is dated by their first order that counts in
      revenue, so counting customers by signup date is not Acme's new-customers figure.
    synonyms: [signup date, registration date]
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:c23cf64bbdcb96589001c93f1e2996216cde164a0ad140485356b4a4f83db6a1
  - name: is_test_account
    expr: is_test_account or email like '%@example-test.com'
    type: boolean
    description: >-
      Whether the customer is an internal test account: true when QA set the is_test_account flag or the email ends in
      @example-test.com, since QA does not always set the flag. True on 20 customers (12 flagged, 8 by email only; as
      measured, not checked against a report).
      Every order figure leaves these customers out.
    synonyms: [test account]
    tags:
      - public
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-27
    approved_hash: sha256:ee7bab53c197ee258c112983524e28c90d8347be5729d06bb04cab823b203630
  - name: acquisition_channel
    expr: acquisition_channel
    type: string
    description: >-
      How the customer first found Acme: organic, paid_search, paid_social, referral, email, affiliate or display. Never
      empty. The paid values have the same names as the marketing spend channels in the lake, but they may not be
      assigned the same way. Acme reports CAC as one blended figure, never per channel, so this is not a basis for a
      per-channel CAC.
    synonyms: [signup channel, acquisition source]
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:ab9c66df5b9d4cdc1565bb6d99b03245e4d22c5115ffaffb1d620fc47326e1af
measures: []
joins:
  - name: home_region
    to: regions
    keys:
      - from: region_code
        to: region_code
    relationship: many_to_one
    type: left
    origin: declared
    description: >-
      The customer's home region (region_code). This is not Acme's sales region: "revenue by region", regional reports
      and sales territories use the order's ship_region, which differs from the home region on 248 of the 4,941 orders whose customer still exists.
    status: approved
    approved_by: Dana Ruiz
    approved_at: 2026-10-26
    approved_hash: sha256:95bdb1f300e1eccd9399a647a19eaabfedebc6021ac34eaae51e7778494fcc9e
